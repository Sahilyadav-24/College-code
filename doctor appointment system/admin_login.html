<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Royal HealthCare Multispeciality Hospital</title>
  <link rel="stylesheet" href="css1style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar (Admin Page) -->
  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-hospital-symbol"></i> Royal HealthCare
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="admin_login.html">Admin Login</a></li>
    </ul>
  </nav>

  <!-- Admin Login Form -->
  <section class="admin-login">
    <h2>Admin Login</h2>
    <form id="adminLoginForm" action="admin_dashboard.html">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Royal HealthCare Multispeciality Hospital</p>
  </footer>

  <script src="js1main.js"></script>
</body>
</html>
